<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIDO2 HUTECH - Đăng Nhập Sinh Viên</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="/vendor/simplewebauthn-browser.min.js"></script>
    <script>
        if (!window.SimpleWebAuthnBrowser) {
            document.write('<script src="https://unpkg.com/@simplewebauthn/browser@14.0.0/dist/bundle/index.umd.min.js"><\/script>');
        }
    </script>
</head>

<body>
    <!-- KHUNG CHÍNH CHIA ĐÔI MÀN HÌNH -->
    <div class="split-wrapper">

        <!-- NỬA TRÁI: BANNER PHI HÀNH GIA -->
        <div class="left-panel">
            <div class="planet planet-top"></div>
            <div class="planet planet-small-1"></div>
            <div class="shooting-line line-1"></div>

            <div class="illustration-circle">
                <div class="passkey-bubble">*******</div>
                <div class="infinity-float">∞</div>
                <svg class="astronaut-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <path d="M30,140 Q10,110 45,105 T80,125" fill="none" stroke="#f8fafc" stroke-width="4"
                        stroke-linecap="round" />
                    <rect x="70" y="75" width="60" height="65" rx="14" fill="#cbd5e1" />
                    <rect x="78" y="82" width="44" height="52" rx="16" fill="#ffffff" />
                    <rect x="88" y="95" width="24" height="16" rx="4" fill="#7c1d54" />
                    <circle cx="95" cy="103" r="3" fill="#f97316" />
                    <circle cx="105" cy="103" r="3" fill="#38bdf8" />
                    <path d="M78,92 Q52,78 46,62" fill="none" stroke="#ffffff" stroke-width="14"
                        stroke-linecap="round" />
                    <path d="M52,70 L48,64" stroke="#f97316" stroke-width="5" stroke-linecap="round" />
                    <circle cx="45" cy="60" r="7" fill="#e2e8f0" />
                    <path d="M122,92 Q148,82 152,65" fill="none" stroke="#ffffff" stroke-width="14"
                        stroke-linecap="round" />
                    <path d="M148,74 L151,68" stroke="#f97316" stroke-width="5" stroke-linecap="round" />
                    <circle cx="153" cy="63" r="7" fill="#e2e8f0" />
                    <path d="M88,132 L76,166" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
                    <path d="M82,150 L79,158" stroke="#f97316" stroke-width="5" stroke-linecap="round" />
                    <ellipse cx="73" cy="171" rx="9" ry="6" fill="#64748b" />
                    <path d="M112,132 L124,160" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
                    <path d="M118,146 L121,154" stroke="#f97316" stroke-width="5" stroke-linecap="round" />
                    <ellipse cx="127" cy="165" rx="9" ry="6" fill="#64748b" />
                    <circle cx="100" cy="54" r="30" fill="#ffffff" />
                    <rect x="78" y="38" width="44" height="30" rx="15" fill="#0f3d5e" />
                    <path d="M84,45 Q100,38 114,45" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"
                        opacity="0.7" />
                    <circle cx="88" cy="55" r="3" fill="#ffffff" opacity="0.6" />
                </svg>
            </div>

            <div class="hero-caption">
                <h2>Nhóm Doraemon</h2>
                <p></p>
            </div>
        </div>

        <!-- NỬA PHẢI: FORM ĐĂNG NHẬP / ĐĂNG KÝ -->
        <div class="right-panel">
            <div class="form-container">
                <div id="guest-view">
                    <h1 class="welcome-title">DEMO FIDO2</h1>
                    <p class="welcome-sub">Vui lòng Đăng Nhập hoặc Đăng Kí để trải nghiệm</p>

                    <div class="input-group">

                        <input type="text" id="username" placeholder="Nhập tên tài khoản" autocomplete="off" />
                    </div>

                    <div class="action-buttons">
                        <button type="button" id="btn-login" class="btn-plum-solid">Đăng Nhập</button>
                        <button type="button" id="btn-register" class="btn-plum-outline">Đăng Kí</button>
                    </div>

                    <!-- Nút Đăng nhập nhanh Passkey 1-chạm -->
                    <div class="passkey-divider">
                        <span>hoặc</span>
                    </div>
                    <button type="button" id="btn-passkey-quick" class="btn-passkey-quick">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M21 2l-2 2m-1.5 1.5L16 7m-1.5 1.5L13 10m-1.5 1.5L10 13l-4 4v4h4l4-4 1.5-1.5M15 5l4 4" />
                            <circle cx="7.5" cy="16.5" r="1.5" />
                        </svg>
                        Đăng nhập nhanh bằng Passkey
                    </button>

                    <div id="inline-popup" class="inline-popup hidden">
                        <span id="inline-popup-icon" class="inline-popup-icon"></span>
                        <span id="inline-popup-text" class="inline-popup-text">Thông báo</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="js/ui.js"></script>
</body>

</html>
